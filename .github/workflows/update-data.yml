name: Update TW Stock Dashboard Data

on:
  schedule:
    - cron: '50 9 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest stock data (with retry)
        run: |
          for i in 1 2 3; do
            echo "Attempt $i..."
            if node fetch_stock_data.mjs > stock_data.json; then
              echo "Fetch succeeded on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed"
            rm -f stock_data.json
            if [ "$i" -lt 3 ]; then
              sleep 60
            fi
          done
          echo "All 3 attempts failed"
          exit 1

      - name: Splice data into dashboard
        run: node splice_data.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tw-stock-dashboard.html institutional_history.json taiex_history.json tpex_index_history.json
          git diff --cached --quiet || git commit -m "Update stock dashboard data $(date -u +%Y-%m-%d)"
          git push

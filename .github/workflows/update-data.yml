name: Update TW Stock Dashboard Data

on:
  schedule:
    - cron: '40 9 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest stock data
        run: node fetch_stock_data.mjs > stock_data.json 2> fetch_err.log

      - name: Splice data into dashboard
        run: node splice_data.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tw-stock-dashboard.html
          git diff --cached --quiet || git commit -m "Update stock dashboard data $(date -u +%Y-%m-%d)"
          git push
